<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>

    <div class="formulario" id="input">
        <label>
            Usuario:
            <input type="text" placeholder="Digite seu usuario" required>
            Senha:
            <input type="password" placeholder="Digite sua senha" required>
        </label>
        <hr>
        <section>

            <p>Qual o seu nivel de satisfação com esse projeto:</p>
            <input type="range" required>

            <p>Escolha algumas da alternativas que correspondem com você:</p>

            <input type="checkbox">Iniciante<br>
            <input type="checkbox">Intermédiario<br>
            <input type="checkbox">Avançado
        </section>

    </div>

</body>

</html>
