<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio2</title>


    <style>
        body {
            background-color: rgb(63, 52, 52);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background-color: rgb(228, 228, 228);
            border-radius: 20px;
            box-shadow: 0px 10px 20px rgba(255, 255, 255, 0.356);

        }

        .card:hover {
            scale: 1.1;
            align-items: center;
        }
    </style>

</head>


<body>
    <div class="card">
        <h1>Ola mundo</h1>
    </div>
</body>

</html>
