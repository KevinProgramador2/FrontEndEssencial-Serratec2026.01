<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pagina de login</title>
</head>

<body>
    <div class="conteiner">
        <div class="coluna-esquerda">
            <img src="img/instagram.png" width="48px" height="48px" alt="logo instagram">
            <h1>Veja momentos do dia a dia dos seus
                <br>
                <span id="destaque">amigos próximos.</span>
            </h1>
        </div>
        <div class="coluna-direita">
            <label for="user"></label>
            <input type="text, number, email" id="user" name="user"
                placeholder="Numero de celular, nome de usuario ou email" required>
            <label for="Password"></label>
            <input type="password" name="Password" id="Password" placeholder="Digite sua Senha" required>
        </div>
    </div>
</body>

</html>
