<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artemis</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main class="container">
        <header class="cabecalho">
            <h1>Junte-se a Missão Artemis</h1>
            <p>Preencha seus dados para a próxima expedição</p>
        </header>
        <form class="formulario-inscricao">
            <div class="grupo-input">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Marcos Pontes">
            </div>
            <div class="grupo-input">
                <label for="email">Email de Contato:</label>
                <input type="email" id="email" placeholder="Email de contato">
            </div>
            <div class="grupo-input">
                <label for="especialidade">Especialidade (Engenharia, Pilotagem...):</label>
                <select name="especialidade" id="especialidade">
                    <option value="piloto"> Piloto de Módulo Lunar </option>
                    <option value="engenheiro"> Engenheiro(a) Aeroespacial </option>
                    <option value="dados"> Cientista de Dados </option>
                </select>
            </div>

            <button type="submit" class="btn-enviar">Solicitar Vaga na Nave</button>
        </form>

    </main>
</body>

</html>
